# Nebula desktop: a focused, translucent Hyprland session for Arch Linux.

monitor = ,preferred,auto,1

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

exec-once = swww-daemon
exec-once = swww img ~/.local/share/backgrounds/nebula.png --transition-type grow --transition-pos 0.7,0.4
exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = fcitx5 -d

input {
    kb_layout = jp
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

general {
    gaps_in = 6
    gaps_out = 18
    border_size = 1
    col.active_border = rgba(c4b5fdcc) rgba(67e8f9cc) 45deg
    col.inactive_border = rgba(ffffff24)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 18
    active_opacity = 0.96
    inactive_opacity = 0.82
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
        special = true
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(080b1a88)
    }
}

animations {
    enabled = true
    bezier = swift, 0.16, 1, 0.3, 1
    bezier = settle, 0.24, 0.72, 0.24, 1
    animation = windows, 1, 5, swift, popin 88%
    animation = windowsOut, 1, 4, settle, popin 88%
    animation = border, 1, 8, settle
    animation = fade, 1, 5, swift
    animation = workspaces, 1, 5, settle, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

bind = SUPER, Return, exec, ghostty
bind = SUPER, Space, exec, rofi -show drun
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, P, pseudo
bind = SUPER, O, layoutmsg, togglesplit
bind = SUPER CTRL, L, exec, hyprlock
bind = SUPER, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, S, exec, grim ~/Pictures/Screenshot-"$(date +%F_%H-%M-%S)".png
bind = SUPER SHIFT, Return, movetoworkspace, special
bind = SUPER, apostrophe, togglespecialworkspace

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

windowrule = float on, match:class ^(pavucontrol)$
windowrule = size 900 620, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(org\.gnome\.Calculator)$
windowrule = center on, match:class ^(org\.gnome\.Calculator)$
windowrule = opacity 0.92 0.88, match:class ^(ghostty)$
