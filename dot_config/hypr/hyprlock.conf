background {
    monitor =
    path = ~/.local/share/backgrounds/nebula.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.58
    contrast = 0.92
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(f8fafcff)
    font_size = 92
    font_family = Ubuntu Sans
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B')"
    color = rgba(cbd5e1ff)
    font_size = 18
    font_family = Ubuntu Sans
    position = 0, 24
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 1
    outer_color = rgba(c4b5fd99)
    inner_color = rgba(0f172aaa)
    font_color = rgba(f8fafcff)
    fade_on_empty = false
    placeholder_text = <i>Unlock your space</i>
    hide_input = false
    rounding = 16
    check_color = rgba(67e8f9ff)
    fail_color = rgba(fda4afff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -90
    halign = center
    valign = center
}

