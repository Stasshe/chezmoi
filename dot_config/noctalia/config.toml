[shell]
clipboard_enabled = true
polkit_agent = true

[shell.screenshot]
save_to_file = true
directory = "~/Pictures/Screenshots"
filename_pattern = "Screenshot_%Y-%m-%d_%H.%M.%S"
copy_to_clipboard = true

[bar.main]
start = ["launcher", "wallpaper", "taskbar"]

[widget.taskbar]
scale = 0.9
capsule_radius = 5.0
capsule_fill = "surface_variant"
capsule_padding = 3
capsule_opacity = 0.48
group_by_workspace = true
show_all_outputs = false
only_active_workspace = false
show_workspace_label = true
workspace_label_placement = "inside"
hide_empty_workspaces = false
workspace_group_capsule = true
workspace_group_content = "icons"
group_single_icon_per_app = true
show_active_indicator = false
active_opacity = 1.0
inactive_opacity = 0.58
focused_color = "primary"
occupied_color = "secondary"
empty_color = "surface_variant"

[wallpaper]
enabled = true
directory = "/usr/share/backgrounds/archlinux"

[wallpaper.default]
path = "/usr/share/backgrounds/archlinux/archwaveinv.png"

[wallpaper.automation]
enabled = false

[theme]
mode = "dark"
source = "builtin"
builtin = "Noctalia"

[lockscreen]
enabled = true

[idle.behavior.lock]
timeout = 300
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 900
action = "suspend"
lock_before_suspend = true
enabled = true
