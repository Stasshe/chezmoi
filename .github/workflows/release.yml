name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: bash
        run: |
          IFS=. read -r major minor patch < VERSION

          if [[ ! "$major.$minor.$patch" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'VERSION must contain a semantic version.\n' >&2
            exit 1
          fi

          case "${{ inputs.bump }}" in
            patch)
              ((patch += 1))
              ;;
            minor)
              ((minor += 1))
              patch=0
              ;;
            major)
              ((major += 1))
              minor=0
              patch=0
              ;;
          esac

          version="$major.$minor.$patch"
          printf '%s\n' "$version" > VERSION
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION
          git commit -m "chore: release v$VERSION"
          git tag --annotate "v$VERSION" --message "Release v$VERSION"
          git push --atomic origin "HEAD:$DEFAULT_BRANCH" "refs/tags/v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes --title "v$VERSION"
