[global]
   server role = standalone server
   map to guest = never
   server min protocol = SMB2
   disable netbios = yes
   fruit:nfs_aces = no

[Documents]
   path = __HOME__/Documents
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   browseable = yes
   read only = no
   guest ok = no
   valid users = __USER__
   force user = __USER__
   create mask = 0600
   directory mask = 0700
